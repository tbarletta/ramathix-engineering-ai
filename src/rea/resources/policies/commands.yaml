default: ask
rules:
  - id: git-read
    decision: allow
    prefixes:
      - ["git", "status"]
      - ["git", "diff"]
      - ["git", "log"]
      - ["git", "show"]
      - ["git", "branch", "--show-current"]
      - ["git", "branch", "--list"]
      - ["git", "branch", "-a"]
      - ["git", "tag"]
      - ["git", "remote", "-v"]

  - id: git-safe-write
    decision: allow
    prefixes:
      - ["git", "checkout", "-b"]
      - ["git", "switch", "-c"]
      - ["git", "worktree", "add"]
      - ["git", "worktree", "remove", "--force"]
      - ["git", "add", "--"]
      - ["git", "commit"]

  - id: tests-and-quality
    decision: allow
    prefixes:
      - ["npm", "test"]
      - ["npm", "run", "test"]
      - ["npm", "run", "lint"]
      - ["npm", "run", "build"]
      - ["pytest"]
      - ["python", "-m", "pytest"]
      - ["ruff", "check"]
      - ["mypy"]
      - ["gradle", "test"]
      - ["./gradlew", "test"]
      - ["./gradlew", "lint"]
      - ["./gradlew", "assembleDebug"]

  - id: docker-safe
    decision: allow
    prefixes:
      - ["docker", "build"]
      - ["docker", "compose", "config"]

  - id: git-push
    decision: ask
    prefixes:
      - ["git", "push"]

  - id: git-clone
    decision: ask
    prefixes:
      - ["git", "clone"]

  - id: git-checkout
    decision: ask
    prefixes:
      - ["git", "checkout"]
      - ["git", "switch"]

  - id: git-sync
    decision: ask
    prefixes:
      - ["git", "pull"]
      - ["git", "fetch"]

  - id: git-merge
    decision: ask
    prefixes:
      - ["git", "merge"]

  - id: git-stash
    decision: ask
    prefixes:
      - ["git", "stash"]

  - id: dependency-install
    decision: ask
    prefixes:
      - ["npm", "install"]
      - ["npm", "ci"]
      - ["pip", "install"]
      - ["python", "-m", "pip", "install"]

  - id: network-fetch
    decision: ask
    prefixes:
      - ["curl"]
      - ["wget"]

  - id: cost-sensitive
    decision: cost_approval
    prefixes:
      - ["terraform", "apply"]
      - ["pulumi", "up"]
      - ["aws", "ec2", "run-instances"]
      - ["aws", "rds", "create-db-instance"]
      - ["gcloud", "compute", "instances", "create"]
      - ["az", "vm", "create"]

  - id: destructive
    decision: deny
    prefixes:
      - ["sudo"]
      - ["shutdown"]
      - ["reboot"]
      - ["rm", "-rf", "/"]
      - ["kubectl", "delete"]
      - ["docker", "system", "prune"]
